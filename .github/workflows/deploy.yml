# Publica o site no GitHub Pages usando o workflow padrão da Setos (Setos-Consultoria/.github).
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: Setos-Consultoria/.github/.github/workflows/pages.yml@main
